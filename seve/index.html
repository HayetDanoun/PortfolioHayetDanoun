<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sève — Back-office streetwear (démo)</title>
<meta name="description" content="Démo d'un back-office e-commerce de vêtements : commandes, stock par variante, clients, statistiques. Conçu et codé par Hayet Danoun.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Reggae+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<script>
  (function(){ var t; try{ t = localStorage.getItem('seve-manga-theme'); }catch(e){}
    if(!t) t = 'light';
    document.documentElement.setAttribute('data-theme', t); })();
</script>
<style>
/* Mise en page : une planche de manga. Cases cerclées d'encre sur papier journal, trames, cachets, bulles. */
:root{--display:'Dela Gothic One','Zen Kaku Gothic New',Impact,sans-serif;--font:'Zen Kaku Gothic New','Segoe UI',system-ui,sans-serif;--sfx:'Reggae One','Dela Gothic One',Impact,sans-serif;--mono:'Zen Kaku Gothic New',ui-monospace,monospace;--ease:cubic-bezier(.16,1,.3,1);--line:3px}
html[data-theme="light"]{
  --bg:#efeee9;--surface:#efeee9;--surface-2:#e2e0d8;--ink:#141317;--soft:#4a4852;--muted:#6f6c77;--line-c:#141317;--line:3px;
  --primary:#141317;--primary-ink:#efeee9;--primary-soft:#e2e0d8;--hot:#d92c2a;--accent:#a35f00;--accent-soft:#f3e3c6;
  --danger:#d92c2a;--danger-soft:#f6d9d6;--info:#2350c9;--info-soft:#dbe2f6;--ok:#1f7a3a;--ok-soft:#d6ead9;--gray-soft:#e2e0d8;--tone:rgba(20,19,23,.22);color-scheme:light}
html[data-theme="dark"]{
  --bg:#131217;--surface:#131217;--surface-2:#1d1c23;--ink:#eceae3;--soft:#a8a5b2;--muted:#8c8996;--line-c:#eceae3;
  --primary:#eceae3;--primary-ink:#131217;--primary-soft:#26252d;--hot:#ff5148;--accent:#f0b03c;--accent-soft:#3a2d14;
  --danger:#ff5148;--danger-soft:#3d1a1a;--info:#7f9cff;--info-soft:#1c2340;--ok:#4fcf7a;--ok-soft:#163222;--gray-soft:#26252d;--tone:rgba(236,234,227,.16);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--hot);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
.tone{background-image:radial-gradient(var(--tone) 1.1px,transparent 1.5px);background-size:7px 7px}

/* bandeau démo */
.demo-bar{display:flex;align-items:center;justify-content:center;gap:.8rem;flex-wrap:wrap;padding:.5rem 1rem;background:var(--hot);color:#fff;font-size:.84rem;font-weight:700;text-align:center;border-bottom:var(--line) solid var(--ink)}
.demo-bar a,.demo-bar button{color:inherit;font-weight:900;text-decoration:underline;text-underline-offset:3px;padding:0}

/* structure */
.app{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 40px)}
.side{position:sticky;top:0;height:calc(100vh - 40px);overflow:auto;padding:1.2rem .9rem;background:var(--ink);color:var(--bg);display:flex;flex-direction:column;gap:1.4rem}
.brand{display:flex;align-items:flex-start;gap:.6rem;padding:.2rem .5rem}
.brand-mark{display:none}
.brand b{display:block;font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1;letter-spacing:.02em}
.brand small{display:block;font-weight:700;font-size:.78rem;color:color-mix(in oklab,var(--bg) 70%,transparent);margin-top:.3rem}
.brand .jp{font-family:var(--sfx);color:var(--hot);writing-mode:vertical-rl;font-size:.9rem;line-height:1}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:.7rem;padding:.6rem .7rem;text-decoration:none;color:color-mix(in oklab,var(--bg) 78%,transparent);font-weight:700;border:2px solid transparent;transition:background .15s,color .15s,transform .15s}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{color:var(--bg);border-color:color-mix(in oklab,var(--bg) 35%,transparent)}
.nav a.on{background:var(--bg);color:var(--ink);border-color:var(--bg);box-shadow:4px 4px 0 var(--hot)}
.nav a .badge{margin-left:auto;font-size:.74rem;font-weight:900;padding:0 .45rem;background:var(--hot);color:#fff;border:2px solid var(--ink)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:.3rem;border-top:2px dashed color-mix(in oklab,var(--bg) 35%,transparent);padding-top:.8rem}
.side-btn{display:flex;align-items:center;gap:.6rem;padding:.5rem .7rem;color:color-mix(in oklab,var(--bg) 78%,transparent);font-weight:700;text-align:left}
.side-btn:hover{color:var(--bg)}
.side-btn svg{width:17px;height:17px}

.main{min-width:0;padding:1.4rem clamp(1rem,2.5vw,2.2rem) 4rem}
.top{display:flex;align-items:flex-end;gap:1rem;margin-bottom:1.4rem;flex-wrap:wrap;padding-bottom:1rem;border-bottom:var(--line) solid var(--ink)}
.top h1{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,3vw,2.4rem);line-height:1;margin:0}
.top h1 .jp{font-family:var(--sfx);color:var(--hot);font-size:.5em;margin-left:.6rem;vertical-align:middle}
.top p{margin:.45rem 0 0;color:var(--soft);font-weight:500}
.top .grow{flex:1;min-width:200px}
.search{display:flex;align-items:center;gap:.5rem;padding:.55rem .8rem;border:2px solid var(--ink);background:var(--surface);min-width:240px;color:var(--soft);font-weight:700}
.search kbd{font-family:var(--font);font-size:.72rem;font-weight:900;border:2px solid var(--ink);padding:0 .35rem;margin-left:auto;color:var(--ink)}
.search svg{width:16px;height:16px}

.btn{display:inline-flex;align-items:center;gap:.45rem;padding:.55rem .95rem;font-weight:900;border:var(--line) solid var(--ink);background:var(--surface);box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s;text-decoration:none}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.danger{color:var(--hot)}
.btn.sm{padding:.3rem .6rem;font-size:.85rem;box-shadow:3px 3px 0 var(--ink)}
.seg{display:inline-flex;border:var(--line) solid var(--ink);background:var(--surface)}
.seg button{padding:.4rem .8rem;font-weight:900;color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--bg)}

/* bannière manga du tableau de bord */
.banner{position:relative;overflow:hidden;border:4px solid var(--ink);background:var(--surface-2);padding:clamp(1rem,3vw,1.8rem);margin-bottom:1.4rem;box-shadow:8px 8px 0 var(--ink)}
.banner::before{content:"";position:absolute;inset:-40%;background:repeating-conic-gradient(from 3deg at 78% 50%,var(--tone) 0deg .7deg,transparent .7deg 4.3deg);-webkit-mask:radial-gradient(circle at 78% 50%,transparent 14%,#000 55%);mask:radial-gradient(circle at 78% 50%,transparent 14%,#000 55%);pointer-events:none}
.banner .sfx{position:absolute;right:2%;top:-6%;font-family:var(--sfx);font-size:clamp(5rem,13vw,9rem);color:transparent;-webkit-text-stroke:2px var(--ink);opacity:.14;writing-mode:vertical-rl;line-height:1;pointer-events:none;user-select:none}
.banner .inner{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:1.2rem;flex-wrap:wrap}
.kicker{display:inline-flex;gap:10px;align-items:center;font-weight:900;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase}
.kicker i{font-style:normal;background:var(--hot);color:#fff;padding:2px 8px}
.banner h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,5vw,3.4rem);line-height:.95;margin:.5rem 0 .9rem}
.bubble{position:relative;display:inline-block;background:var(--surface);border:var(--line) solid var(--ink);border-radius:999px/70%;padding:.7rem 1.5rem;font-weight:700;line-height:1.35;max-width:36em}
.bubble::after{content:"";position:absolute;left:34px;bottom:-14px;width:18px;height:18px;background:var(--surface);border-right:var(--line) solid var(--ink);border-bottom:var(--line) solid var(--ink);transform:skewX(30deg) rotate(45deg)}
.banner .tools{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}

.grid{display:grid;gap:1.2rem}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.panel{position:relative;background:var(--surface);border:var(--line) solid var(--ink);padding:1.1rem 1.2rem;min-width:0}
.panel h2{font-family:var(--display);font-weight:400;font-size:1.15rem;margin:0;line-height:1.1}
.panel .sub{color:var(--soft);font-size:.86rem;margin:.3rem 0 0;font-weight:500}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1rem}
.kpi{transition:transform .18s,box-shadow .18s}
.kpi:hover{transform:translate(-3px,-3px) rotate(-.4deg);box-shadow:8px 8px 0 var(--ink)}
.kpi .label{font-size:.76rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.kpi .val{font-family:var(--display);font-size:1.9rem;line-height:1.1;margin:.35rem 0 .45rem}
.kpi .row{display:flex;align-items:flex-end;justify-content:space-between;gap:.5rem}
.delta{font-size:.74rem;font-weight:900;white-space:nowrap;display:inline-flex;align-items:center;gap:.2rem;padding:1px 7px;border:2px solid currentColor;transform:rotate(-2deg);background:var(--surface)}
.delta.up{color:var(--ok)}.delta.down{color:var(--hot)}
.spark{width:96px;height:34px}
.two{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.halves{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.three{grid-template-columns:1fr}}
@media (max-width:700px){.halves{grid-template-columns:1fr}}

/* à faire */
.todo{display:flex;flex-direction:column;gap:.7rem}
.todo a{display:flex;align-items:center;gap:.8rem;padding:.7rem .8rem;text-decoration:none;border:2px solid var(--ink);background:var(--surface);transition:transform .12s,box-shadow .12s}
.todo a:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.todo .ic{width:36px;height:36px;display:grid;place-items:center;flex:none;border:2px solid var(--ink)}
.todo .ic svg{width:18px;height:18px}
.todo b{font-family:var(--display);font-weight:400;font-size:1rem}
.todo span{color:var(--soft);font-size:.84rem;display:block;line-height:1.3;font-weight:500}
.todo .go{margin-left:auto;color:var(--ink)}

/* graphiques */
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.axis text{fill:var(--soft);font-size:11px;font-family:var(--font);font-weight:700}
.gridline{stroke:var(--ink);stroke-opacity:.14;stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--ink);border:var(--line) solid var(--ink);border-radius:999px/70%;padding:.4rem 1rem;font-size:.8rem;font-weight:700;white-space:nowrap;transform:translate(-50%,calc(-100% - 16px));opacity:0;transition:opacity .15s;z-index:5;text-align:center}
.tip b{display:block;font-family:var(--display);font-weight:400;font-size:1rem}
.tip.show{opacity:1}
.hbars{display:flex;flex-direction:column;gap:.65rem}
.hbar{display:grid;grid-template-columns:minmax(90px,140px) 1fr auto;gap:.7rem;align-items:center;font-size:.88rem;font-weight:700}
.hbar .track{height:14px;border:2px solid var(--ink);background-image:radial-gradient(var(--tone) 1px,transparent 1.4px);background-size:5px 5px;overflow:hidden}
.hbar .fill{height:100%;background:var(--ink);transform-origin:left;animation:grow .8s var(--ease) both}
.hbar:first-child .fill{background:var(--hot)}
@keyframes grow{from{transform:scaleX(0)}}
.hbar .v{font-weight:900;font-size:.82rem;min-width:4.5rem;text-align:right}
.insight{position:relative;display:flex;gap:.6rem;align-items:flex-start;margin-top:1.2rem;padding:.8rem 1.1rem;border:var(--line) solid var(--ink);border-radius:18px;background:var(--surface);font-size:.9rem;font-weight:500}
.insight::before{content:"!";position:absolute;top:-14px;left:-10px;font-family:var(--sfx);font-size:1.6rem;color:var(--hot);transform:rotate(-12deg);line-height:1}
.insight svg{width:18px;height:18px;flex:none;color:var(--hot);margin-top:2px}

/* tableaux */
.toolbar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}
.toolbar .grow{flex:1}
.input{padding:.5rem .75rem;border:2px solid var(--ink);background:var(--surface);min-width:220px;font-weight:500}
select.input{min-width:0}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap}
.tab{padding:.3rem .8rem;border:2px solid var(--ink);background:transparent;font-weight:700;font-size:.88rem;display:inline-flex;gap:.4rem;align-items:center}
.tab.on{background:var(--ink);color:var(--bg)}
.tab .c{font-weight:900;font-size:.76rem;opacity:.75}
.table-wrap{overflow:auto;border:var(--line) solid var(--ink);background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:720px}
th{text-align:left;font-weight:900;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;padding:.7rem 1rem;border-bottom:var(--line) solid var(--ink);background:var(--surface-2);position:sticky;top:0;white-space:nowrap;z-index:1}
th.r,td.r{text-align:right}
td{padding:.7rem 1rem;border-bottom:1.5px dashed color-mix(in oklab,var(--ink) 35%,transparent);vertical-align:middle;font-weight:500}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background-image:radial-gradient(var(--tone) 1px,transparent 1.4px);background-size:6px 6px}
tbody tr:last-child td{border-bottom:0}
.cell-main{display:flex;align-items:center;gap:.7rem}
.cell-main small{display:block;color:var(--soft);font-size:.8rem}
.mono{font-family:var(--display);font-size:.85rem;letter-spacing:.03em}
.pill{display:inline-flex;align-items:center;padding:1px 8px;font-size:.7rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;border:2px solid currentColor;background:var(--surface);transform:rotate(-2deg)}
.st-prep{color:var(--accent)}
.st-ship{color:var(--info)}
.st-done{color:var(--ok)}
.st-ret{color:var(--hot)}
.st-cancel{color:var(--muted)}
.stock-ok{color:var(--ok)}
.stock-low{color:var(--accent)}
.stock-out{color:var(--hot)}
.empty{padding:3rem 1rem;text-align:center;color:var(--soft);font-weight:700}
.garment{width:42px;height:42px;background:var(--surface-2);border:2px solid var(--ink);display:grid;place-items:center;flex:none}
.garment svg{width:30px;height:30px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:.78rem;flex:none;background:var(--ink);color:var(--bg)}
.dots{display:flex;gap:3px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}

/* tiroirs + modales */
.scrim{position:fixed;inset:0;background:rgba(10,9,12,.65);background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1.4px);background-size:6px 6px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);border-left:4px solid var(--ink);z-index:50;transform:translateX(104%);transition:transform .45s var(--ease);display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;padding:1.2rem 1.4rem;border-bottom:var(--line) solid var(--ink);background-color:var(--surface-2);background-image:radial-gradient(var(--tone) 1.1px,transparent 1.5px);background-size:7px 7px}
.drawer-head h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.5rem;line-height:1.1}
.drawer-head p{margin:.3rem 0 0;color:var(--soft);font-weight:700}
.drawer-body{padding:1.2rem 1.4rem;overflow:auto;flex:1;display:flex;flex-direction:column;gap:1.3rem}
.drawer-foot{padding:1rem 1.4rem;border-top:var(--line) solid var(--ink);display:flex;gap:.7rem;flex-wrap:wrap;justify-content:flex-end}
.close{width:40px;height:40px;display:grid;place-items:center;border:var(--line) solid var(--ink);background:var(--surface);flex:none}
.close svg{width:16px;height:16px}
.block h4{margin:0 0 .6rem;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;font-weight:900;color:var(--soft)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.35rem 1rem;font-size:.92rem}
.kv dt{color:var(--soft);font-weight:500}.kv dd{margin:0;text-align:right;font-weight:700}
.lines{display:flex;flex-direction:column;gap:.6rem}
.line{display:flex;align-items:center;gap:.8rem}
.line .info{flex:1;min-width:0}
.line .info small{display:block;color:var(--soft)}
.timeline{display:flex;flex-direction:column;gap:.8rem;position:relative;padding-left:1.3rem}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:3px;background:var(--ink)}
.tl{position:relative;font-size:.92rem;font-weight:700}
.tl::before{content:"";position:absolute;left:-1.3rem;top:5px;width:13px;height:13px;background:var(--hot);border:2px solid var(--ink)}
.tl small{display:block;color:var(--soft);font-weight:500;font-size:.78rem}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}
.mini-stats div{padding:.7rem .8rem;border:2px solid var(--ink);background:var(--surface)}
.mini-stats b{display:block;font-family:var(--display);font-weight:400;font-size:1.2rem}
.mini-stats span{color:var(--soft);font-size:.8rem;font-weight:700}

.matrix{width:100%;border-collapse:separate;border-spacing:5px;min-width:0}
.matrix th{background:none;border:0;padding:.2rem;text-align:center;font-size:.76rem;position:static;letter-spacing:.05em}
.matrix th.rowh{text-align:left;white-space:nowrap;text-transform:none;letter-spacing:0;font-size:.85rem}
.matrix td{padding:0;border:0}
.cellq{display:flex;flex-direction:column;align-items:center;gap:3px;padding:.35rem .2rem;border:2px solid var(--ink);background:var(--surface)}
.cellq b{font-family:var(--display);font-weight:400;font-size:1.05rem}
.cellq.low{background:var(--accent-soft)}
.cellq.out{background:var(--danger-soft);background-image:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in oklab,var(--hot) 25%,transparent) 5px 6px)}
.cellq .pm{display:flex;gap:2px}
.cellq .pm button{width:22px;height:22px;border:2px solid var(--ink);background:var(--surface);font-weight:900;line-height:1;display:grid;place-items:center}
.cellq .pm button:hover{background:var(--ink);color:var(--bg)}

.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:1rem;pointer-events:none}
.modal .box{width:min(540px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:4px solid var(--ink);box-shadow:12px 12px 0 var(--ink);opacity:0;transform:translateY(12px) rotate(-.5deg);transition:opacity .25s,transform .35s var(--ease)}
.modal.on{pointer-events:auto;background:rgba(10,9,12,.55)}
.modal.on .box{opacity:1;transform:none}
.form{display:flex;flex-direction:column;gap:.9rem;padding:1.3rem 1.4rem}
.form h3{font-family:var(--display);font-weight:400;font-size:1.6rem}
.form label{display:flex;flex-direction:column;gap:.35rem;font-size:.74rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.form .input{min-width:0;width:100%;text-transform:none;letter-spacing:0;font-size:.95rem}
.form .hint{color:var(--soft);font-weight:500;font-size:.8rem;text-transform:none;letter-spacing:0}
.err{color:var(--hot);font-size:.88rem;font-weight:900;min-height:1.2em}
.checks{display:flex;flex-wrap:wrap;gap:.4rem}
.checks label{flex-direction:row;align-items:center;gap:.35rem;padding:.3rem .55rem;border:2px solid var(--ink);font-weight:700;text-transform:none;letter-spacing:0;font-size:.85rem}
.checks input{accent-color:var(--hot)}

/* palette */
.pal .box{align-self:start;margin-top:12vh}
.pal input{width:100%;border:0;border-bottom:var(--line) solid var(--ink);padding:1rem 1.2rem;background:transparent;outline:none;font-size:1rem;font-weight:700}
.pal ul{list-style:none;margin:0;padding:.4rem;max-height:55vh;overflow:auto}
.pal li button{width:100%;display:flex;align-items:center;gap:.7rem;padding:.55rem .8rem;text-align:left;font-weight:700;border:2px solid transparent}
.pal li button.sel{border-color:var(--ink);background:var(--surface-2);box-shadow:4px 4px 0 var(--hot)}
.pal li small{margin-left:auto;color:var(--soft);font-size:.78rem}

const STATUS = {prep:{l:'À préparer',c:'st-prep'}, ship:{l:'Expédiée',c:'st-ship'}, done:{l:'Livrée',c:'st-done'}, ret:{l:'Retournée',c:'st-ret'}, cancel:{l:'Annulée',c:'st-cancel'}};

function generate(){
  const r = rng(20261106);
  const products = PRODUCTS0.map((p,i) => {
    const sizes = p[1] === 'Accessoires' ? ['TU'] : SIZES;
    const variants = [];
    p[4].forEach(color => sizes.forEach((size,si) => {
      const base = p[1] === 'Accessoires' ? 26 : 34 * (sizes.length > 1 ? SIZE_W[si] * 3 : 1);
      let stock = Math.round(base * (0.25 + r()*1.1));
      if (r() < .09) stock = 0; else if (r() < .12) stock = 1 + Math.floor(r()*3);
      variants.push({sku:`SV-${String(i+1).padStart(2,'0')}-${color.slice(0,3).toUpperCase()}-${size}`, color, size, stock});
    }));
    return {id:'p'+(i+1), name:p[0], cat:p[1], price:p[2], cost:p[3], colors:p[4], pop:p[5], variants, created: today0 - (200 + i*9)*DAY};
  });
  const customers = [];
  for (let i=0;i<110;i++){
    const f = FIRST[Math.floor(r()*FIRST.length)], l = LAST[Math.floor(r()*LAST.length)];
    customers.push({id:'c'+(i+1), first:f, last:l, email:`${f.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}.${l.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}@exemple.fr`, city:pickW(r, CITIES, CITY_W), loyalty: r() < .15 ? 6 : r() < .35 ? 2.5 : 1});
  }
  const custW = customers.map(c => c.loyalty);
  const orders = [];
  for (let d=179; d>=0; d--){
    const t = today0 - d*DAY, dow = new Date(t).getDay();
    const growth = 1 + (179-d)/179 * .55;
    let count = (2.6 + r()*2.4) * growth * (dow===0 ? 1.35 : dow===6 ? 1.15 : 1);
    if (d === 0) count *= (new Date().getHours() + 1) / 24;
    count = Math.round(count);
    for (let k=0;k<count;k++){
      const hour = pickW(r, [...Array(24).keys()], [0.2,0.1,0.05,0.05,0.05,0.1,0.3,0.7,1,1.1,1.2,1.5,2.2,2.1,1.4,1.2,1.3,1.6,2,2.6,3,2.9,2,0.8].map((w,h)=> dow===0 && h>=19 && h<=22 ? w*1.6 : w));
      const time = t + hour*36e5 + Math.floor(r()*36e5);
      if (time > Date.now()) continue;
      const cust = pickW(r, customers, custW);
      const nLines = pickW(r, [1,2,3], [.62,.29,.09]);
      const lines = [];
      for (let j=0;j<nLines;j++){
        const p = pickW(r, products, products.map(x => x.pop));
        const color = p.colors[Math.floor(r()*p.colors.length)];
        const size = p.cat === 'Accessoires' ? 'TU' : pickW(r, SIZES, SIZE_W);
        const ex = lines.find(x => x.pid===p.id && x.color===color && x.size===size);
        if (ex) ex.qty++; else lines.push({pid:p.id, color, size, qty: r() < .1 ? 2 : 1, price:p.price});
      }
      const sub = lines.reduce((a,l)=>a+l.qty*l.price,0);
      const ship = sub >= 80 ? 0 : 4.9;
      const channel = pickW(r, CHANNELS, [.7,.2,.1]);
      let status = 'done';
      const age = (Date.now() - time) / DAY;
      if (age < 1) status = r() < .85 ? 'prep' : 'ship';
      else if (age < 3) status = r() < .3 ? 'prep' : 'ship';
      else if (age < 6) status = r() < .5 ? 'ship' : 'done';
      const roll = r();
      if (age > 5 && roll < .065) status = 'ret';
      else if (roll > .975) status = 'cancel';
      const hist = [{s:'created', t:time}];
      if (status !== 'prep' && status !== 'cancel') hist.push({s:'ship', t: time + (0.6 + r()*1.4)*DAY});
      if (status === 'done' || status === 'ret') hist.push({s:'done', t: time + (2.5 + r()*2)*DAY});
      if (status === 'ret') hist.push({s:'ret', t: time + (6 + r()*6)*DAY});
      if (status === 'cancel') hist.push({s:'cancel', t: time + r()*.3*DAY});
      orders.push({id:0, time, cid:cust.id, lines, sub, ship, total: sub + ship, channel, status, hist, reason: status==='ret' ? RETURN_REASONS[pickW(r,[0,1,2,3,4],[.34,.22,.16,.08,.2])] : null});
    }
  }
  orders.sort((a,b)=>a.time-b.time).forEach((o,i)=>{ o.id = 'SV-' + (10241 + i); });
  customers.forEach(c => { const f = orders.find(o=>o.cid===c.id); c.since = f ? f.time : today0 - 30*DAY; });
  return {products, customers, orders, threshold:5, promos:[], v:1};
}

const valid = o => o.status !== 'cancel';
const inRange = (o, from, to) => o.time >= from && o.time < to;
function periodStats(days, offset=0){
  const to = today0 + DAY - offset*days*DAY, from = to - days*DAY;
  const os = S.orders.filter(o => inRange(o, from, to));
  const sold = os.filter(o => valid(o) && o.status !== 'ret');
  const rev = sold.reduce((a,o)=>a+o.sub,0);
  const closed = os.filter(o => o.status==='done' || o.status==='ret');
  return {from, to, orders: os.filter(valid).length, rev, aov: sold.length ? rev/sold.length : 0, ret: closed.length ? os.filter(o=>o.status==='ret').length/closed.length : 0, list: os};
}
function dailySeries(days, fn){
  const out = [];
  for (let d=days-1; d>=0; d--){
    const from = today0 - d*DAY, to = from + DAY;
    out.push({t:from, v: fn(S.orders.filter(o => inRange(o, from, to)))});
  }
  return out;
}
const revOf = os => os.filter(o=>valid(o)&&o.status!=='ret').reduce((a,o)=>a+o.sub,0);
const stockOf = p => p.variants.reduce((a,v)=>a+v.stock,0);
const stockState = p => { const outs = p.variants.filter(v=>v.stock===0).length, lows = p.variants.filter(v=>v.stock>0 && v.stock<=S.threshold).length;
  if (outs === p.variants.length) return {k:'out', l:'Rupture'}; if (outs || lows) return {k:'low', l: outs ? `${outs} variante${outs>1?'s':''} en rupture` : 'Stock faible'}; return {k:'ok', l:'En stock'}; };
function salesByVariant(days){
  const from = today0 + DAY - days*DAY, m = {};
  S.orders.forEach(o => { if (o.time < from || !valid(o) || o.status==='ret') return; o.lines.forEach(l => { const k = l.pid+'|'+l.color+'|'+l.size; m[k] = (m[k]||0) + l.qty; }); });
  return m;
}
function restock(){
  const sales = salesByVariant(30), out = [];
  S.products.forEach(p => p.variants.forEach(v => {
    const sold = sales[p.id+'|'+v.color+'|'+v.size] || 0; if (!sold) return;
    const perDay = sold / 30, days = v.stock / perDay;
    if (days < 21) out.push({p, v, perDay, days, qty: Math.max(1, Math.ceil(perDay*45 - v.stock))});
  }));
  return out.sort((a,b)=>a.days-b.days);
}
function custStats(c){
  const os = S.orders.filter(o => o.cid===c.id).sort((a,b)=>b.time-a.time);
  const spent = os.filter(o=>valid(o)&&o.status!=='ret').reduce((a,o)=>a+o.total,0);
  const sizes = {}, cats = {};
  os.forEach(o => o.lines.forEach(l => { if (l.size!=='TU') sizes[l.size]=(sizes[l.size]||0)+l.qty; const cat = P(l.pid).cat; cats[cat]=(cats[cat]||0)+l.qty; }));
  const top = m => Object.entries(m).sort((a,b)=>b[1]-a[1])[0];
  return {os, count: os.filter(valid).length, spent, last: os[0] ? os[0].time : null, size: top(sizes), cat: top(cats)};
}
function segment(c, st){
  if (!st.count) return null;
  if (st.spent >= 350) return {k:'vip', l:'VIP'};
  if (st.last && Date.now() - st.last > 60*DAY) return {k:'lapsed', l:'À relancer'};
  if (Date.now() - c.since < 30*DAY) return {k:'new', l:'Nouveau'};
  if (st.count >= 3) return {k:'loyal', l:'Fidèle'};
  return {k:'reg', l:'Régulier'};
}

function lineChart(series, {h=240, money=true}={}){
  const W = Math.round(Math.min(720, Math.max(320, (($('#main')||{}).clientWidth||760) - 90))), pad = {l:52, r:12, t:12, b:26};
  const max = Math.max(1, ...series.map(d=>d.v)) * 1.12;
  const step = niceStep(max/4), top = Math.ceil(max/step)*step;
  const x = i => pad.l + i * (W - pad.l - pad.r) / Math.max(1, series.length-1);
  const y = v => pad.t + (1 - v/top) * (h - pad.t - pad.b);
  const pts = series.map((d,i)=>[x(i), y(d.v)]);
  const path = smooth(pts);
  const area = path + ` L${x(series.length-1)},${y(0)} L${x(0)},${y(0)} Z`;
  let grid = '';
  for (let v=0; v<=top+1e-6; v+=step) grid += `<line class="gridline" x1="${pad.l}" x2="${W-pad.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${pad.l-8}" y="${y(v)+4}" text-anchor="end">${money ? (v>=1000 ? (v/1000).toLocaleString('fr-FR')+' k' : v) : v}</text>`;
  const every = Math.ceil(series.length / 6);
  let xl = '';
  series.forEach((d,i)=>{ if (i % every === 0 || i === series.length-1) xl += `<text x="${x(i)}" y="${h-6}" text-anchor="middle">${fmtDate(d.t)}</text>`; });
  const id = 'g' + Math.random().toString(36).slice(2,7);
  return `<div class="chart" data-line>
    <svg viewBox="0 0 ${W} ${h}" style="width:100%;height:auto" role="img" aria-label="Évolution du chiffre d'affaires">
      <defs><pattern id="${id}" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.25" fill="var(--ink)" opacity=".38"/></pattern></defs>
      <g class="axis">${grid}${xl}</g>
      <path d="${area}" fill="url(#${id})"/>
      <path d="${path}" fill="none" stroke="var(--ink)" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linejoin="round" style="stroke-dasharray:3000;stroke-dashoffset:3000;animation:draw 1.2s var(--ease) forwards"/>
      <line class="xh" x1="0" x2="0" y1="${pad.t}" y2="${h-pad.b}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="4 4" opacity="0" vector-effect="non-scaling-stroke"/>
      <circle class="dot" r="6" fill="var(--hot)" stroke="var(--ink)" stroke-width="2.5" opacity="0"/>
      <rect class="hit" x="${pad.l}" y="0" width="${W-pad.l-pad.r}" height="${h}" fill="transparent"/>
    </svg>
    <div class="tip"></div>
  </div>`;
}
function bindLine(el, series, money=true){
  const svg = $('svg', el), tip = $('.tip', el), xh = $('.xh', el), dot = $('.dot', el), hit = $('.hit', el);
  const vb = svg.viewBox.baseVal, W = vb.width, h = vb.height, pad = {l:52, r:12, t:12, b:26};
  const max = Math.max(1, ...series.map(d=>d.v)) * 1.12, step = niceStep(max/4), top = Math.ceil(max/step)*step;
  const move = e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(series.length-1, Math.round((px - pad.l) / ((W-pad.l-pad.r)/Math.max(1,series.length-1)))));
    const x = pad.l + i*(W-pad.l-pad.r)/Math.max(1,series.length-1), y = pad.t + (1 - series[i].v/top)*(h-pad.t-pad.b);
    xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.setAttribute('opacity', 1);
    dot.setAttribute('cx', x); dot.setAttribute('cy', y); dot.setAttribute('opacity', 1);
    dot.setAttribute('transform', `scale(${1}, 1)`);
    tip.innerHTML = `<b>${money ? eur(series[i].v) : series[i].v}</b>${new Date(series[i].t).toLocaleDateString('fr-FR',{weekday:'long', day:'numeric', month:'long'})}`;
    tip.style.left = (x / W * r.width) + 'px'; tip.style.top = (y / h * r.height) + 'px'; tip.classList.add('show');
  };
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerleave', () => { tip.classList.remove('show'); xh.setAttribute('opacity',0); dot.setAttribute('opacity',0); });
}
function niceStep(raw){ const p = Math.pow(10, Math.floor(Math.log10(raw||1))); const n = raw/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function smooth(pts){
  if (pts.length < 2) return '';
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i=0;i<pts.length-1;i++){
    const [x0,y0] = pts[i-1] || pts[i], [x1,y1] = pts[i], [x2,y2] = pts[i+1], [x3,y3] = pts[i+2] || pts[i+1];
    const t = .18;
    d += ` C${x1+(x2-x0)*t},${y1+(y2-y0)*t} ${x2-(x3-x1)*t},${y2-(y3-y1)*t} ${x2},${y2}`;
  }
  return d;
}
function spark(series){
  const W = 96, H = 34, max = Math.max(1,...series), min = Math.min(...series);
  const pts = series.map((v,i)=>[i*W/(series.length-1), H-3-(v-min)/(max-min||1)*(H-6)]);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${smooth(pts)}" fill="none" stroke="var(--ink)" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`;
}
function hbars(rows, fmt){
  const max = Math.max(1, ...rows.map(r=>r.v));
  return `<div class="hbars">${rows.map((r,i)=>`<div class="hbar" title="${esc(r.label)} : ${esc(fmt(r.v))}"><span>${esc(r.label)}</span><div class="track"><div class="fill" style="width:${r.v/max*100}%;animation-delay:${i*50}ms;${r.color?`background:${r.color}`:''}"></div></div><span class="v">${fmt(r.v)}</span></div>`).join('')}</div>`;
}
function vbars(rows, fmt){
  const max = Math.max(1, ...rows.map(r=>r.v)), H = 170;
  return `<div class="chart" data-vbars><div style="display:flex;align-items:flex-end;gap:10px;height:${H+40}px;padding-top:10px">${rows.map((r,i)=>`
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end" data-tip="${esc(r.label)} : ${esc(fmt(r.v))}">
      <span style="font-weight:900;font-size:.8rem">${fmt(r.v)}</span>
      <div style="width:100%;max-width:56px;height:${Math.max(2, r.v/max*H)}px;background:${r.v===max?'var(--hot)':'var(--ink)'};border:2px solid var(--ink);transform-origin:bottom;animation:growY .8s var(--ease) ${i*60}ms both"></div>
      <span style="font-family:var(--display);font-size:.9rem">${esc(r.label)}</span>
    </div>`).join('')}</div></div>`;
}

    <tbody>${list.map(p => { const st = stockState(p); const sold = p.variants.reduce((a,v)=>a+(sales[p.id+'|'+v.color+'|'+v.size]||0),0); return `<tr data-product="${p.id}" tabindex="0">

function viewStats(){
  const from = today0 + DAY - period*DAY;
  const os = S.orders.filter(o => o.time >= from && valid(o) && o.status!=='ret');
  const byCat = {}, bySize = {}, byChan = {};
  os.forEach(o => { byChan[o.channel] = (byChan[o.channel]||0) + o.sub; o.lines.forEach(l => { const p = P(l.pid); byCat[p.cat] = (byCat[p.cat]||0) + l.qty*l.price; if (l.size!=='TU') bySize[l.size] = (bySize[l.size]||0) + l.qty; }); });
  const sizeTot = Object.values(bySize).reduce((a,b)=>a+b,0) || 1;
  const topSize = Object.entries(bySize).sort((a,b)=>b[1]-a[1])[0] || ['M',0];
  // heatmap jour x tranche horaire
  const heat = Array.from({length:7}, () => Array(12).fill(0));
  S.orders.filter(o=>o.time>=from && valid(o)).forEach(o => { const d = new Date(o.time); heat[(d.getDay()+6)%7][Math.floor(d.getHours()/2)]++; });
  const hmax = Math.max(1, ...heat.flat());
  let best = [0,0]; heat.forEach((r,i)=>r.forEach((v,j)=>{ if (v > heat[best[0]][best[1]]) best = [i,j]; }));
  const DAYS = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'], DAYS_L = ['le lundi','le mardi','le mercredi','le jeudi','le vendredi','le samedi','le dimanche'];
  const reasons = {}; S.orders.filter(o=>o.status==='ret' && o.time>=from - 60*DAY).forEach(o => { reasons[o.reason] = (reasons[o.reason]||0) + 1; });
  const rtot = Object.values(reasons).reduce((a,b)=>a+b,0) || 1;
  const sizeIssue = ((reasons['Taille trop petite']||0) + (reasons['Taille trop grande']||0)) / rtot;
  // clients nouveaux vs récurrents
  const firstOrder = {}; [...S.orders].sort((a,b)=>a.time-b.time).forEach(o => { if (!firstOrder[o.cid]) firstOrder[o.cid] = o.id; });
  const newC = os.filter(o => firstOrder[o.cid] === o.id).length;
  return `<div class="view">${topBar('Statistiques', 'Pour décider quoi produire, quand communiquer et quoi améliorer.',
    `<div class="seg" role="group" aria-label="Période">${[7,30,90].map(p=>`<button type="button" data-period="${p}" class="${period===p?'on':''}" aria-pressed="${period===p}">${p} j</button>`).join('')}</div>`)}
  <div class="grid halves">
    <div class="panel"><div class="panel-head"><div><h2>Ventes par taille</h2><p class="sub">Pièces vendues, hors accessoires</p></div></div>${vbars(SIZES.map(s=>({label:s, v:bySize[s]||0})), v=>n0(v))}
      <div class="insight">${ic('bulb')}<span>Le <b>${topSize[0]}</b> représente <b>${pct(topSize[1]/sizeTot)}</b> des ventes. Pour la prochaine production de 100 pièces : ${SIZES.map(s=>`${s} ${Math.round((bySize[s]||0)/sizeTot*100)}`).join(', ')}.</span></div></div>
    <div class="panel"><div class="panel-head"><div><h2>Chiffre d'affaires par catégorie</h2><p class="sub">Sur ${period} jours</p></div></div>${hbars(CATS.map(c=>({label:c, v:byCat[c]||0})).sort((a,b)=>b.v-a.v), v=>eur(v))}</div>
  </div>
  <div class="panel" style="margin-top:1rem"><div class="panel-head"><div><h2>Quand vos clients commandent</h2><p class="sub">Nombre de commandes par jour et par tranche de 2 heures. Plus la case est foncée, plus il y a de commandes.</p></div></div>
    <div style="overflow:auto"><table class="matrix" style="min-width:560px"><thead><tr><th></th>${Array.from({length:12},(_,j)=>`<th class="mono">${j*2}h</th>`).join('')}</tr></thead><tbody>
    ${heat.map((r,i)=>`<tr><th class="rowh">${DAYS[i]}</th>${r.map((v,j)=>`<td title="${DAYS[i]} ${j*2}h–${j*2+2}h : ${v} commande${v>1?'s':''}"><div style="height:30px;border:1.5px solid var(--ink);background:color-mix(in oklab, var(--ink) ${Math.round(4 + v/hmax*96)}%, var(--surface))"></div></td>`).join('')}</tr>`).join('')}
    </tbody></table></div>
    <div class="insight">${ic('bulb')}<span>Pic de commandes <b>${DAYS_L[best[0]]} entre ${best[1]*2}h et ${best[1]*2+2}h</b>. C'est le meilleur moment pour publier sur Instagram ou envoyer une newsletter.</span></div></div>
  <div class="grid three" style="margin-top:1rem">
    <div class="panel"><div class="panel-head"><div><h2>Canaux de vente</h2><p class="sub">Chiffre d'affaires</p></div></div>${hbars(CHANNELS.map(c=>({label:c, v:byChan[c]||0})), v=>eur(v))}</div>
    <div class="panel"><div class="panel-head"><div><h2>Motifs de retour</h2><p class="sub">Sur les retours récents</p></div></div>${hbars(RETURN_REASONS.map(r=>({label:r, v:reasons[r]||0})).sort((a,b)=>b.v-a.v), v=>n0(v))}
      <div class="insight">${ic('bulb')}<span><b>${pct(sizeIssue)}</b> des retours viennent de la taille. Un guide des tailles plus précis sur la fiche produit réduirait les retours.</span></div></div>
    <div class="panel"><div class="panel-head"><div><h2>Nouveaux et récurrents</h2><p class="sub">Commandes sur ${period} jours</p></div></div>
      <div class="mini-stats" style="grid-template-columns:1fr 1fr"><div><b class="num">${n0(newC)}</b><span>de nouveaux clients</span></div><div><b class="num">${n0(os.length-newC)}</b><span>de clients déjà venus</span></div></div>
      <div style="height:16px;border:2px solid var(--ink);overflow:hidden;display:flex;margin-top:1rem;gap:2px"><div style="width:${newC/Math.max(1,os.length)*100}%;background:var(--hot)"></div><div style="flex:1;background:var(--ink)"></div></div>
      <p class="sub" style="margin-top:.6rem"><span style="color:var(--hot)">■</span> Nouveaux &nbsp; <span style="color:var(--ink)">■</span> Récurrents</p></div>
  </div></div>`;
}

let lastFocus = null;
function openDrawer(html){ lastFocus = document.activeElement; $('#drawer').innerHTML = html; $('#drawer').classList.add('on'); $('#scrim').classList.add('on'); setTimeout(()=>{ const f = $('#drawer .close'); f && f.focus(); }, 50); }
function closeDrawer(){ $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
function openModal(html, cls=''){ lastFocus = document.activeElement; $('#modal').className = 'modal on ' + cls; $('#modalBox').innerHTML = html; setTimeout(()=>{ const f = $('#modalBox input, #modalBox button'); f && f.focus(); }, 60); }
function closeModal(){ $('#modal').className = 'modal'; if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
const head = (t, s) => `<div class="drawer-head"><div><h3 id="drawerTitle">${t}</h3><p>${s}</p></div><button class="close" type="button" data-act="close" aria-label="Fermer">${ic('x')}</button></div>`;

const HIST_L = {created:'Commande passée', ship:'Expédiée', done:'Livrée', ret:'Retour enregistré', cancel:'Annulée'};
function orderDrawer(id){
  const o = S.orders.find(x=>x.id===id); if (!o) return;
  const c = C(o.cid);
  const actions = [];
  if (o.status==='prep') actions.push(`<button class="btn danger" type="button" data-oact="cancel">Annuler la commande</button>`, `<button class="btn primary" type="button" data-oact="ship">${ic('truck')}Marquer comme expédiée</button>`);
  if (o.status==='ship') actions.push(`<button class="btn primary" type="button" data-oact="done">Marquer comme livrée</button>`);
  if (o.status==='done') actions.push(`<button class="btn" type="button" data-oact="ret">${ic('ret')}Enregistrer un retour</button>`);
  openDrawer(`${head(`Commande <span style="white-space:nowrap">${o.id}</span>`, `${fmtDateTime(o.time)} · ${o.channel}`)}
  <div class="drawer-body">

function palette(){

  let sel = 0, items = [];
  const draw = () => {
    const q = $('#palQ').value.trim().toLowerCase();
    const pages = Object.entries(VIEWS).map(([k,v])=>({g:'Pages', l:v.t, s:'', go:()=>{ location.hash = k; }}));
    const prods = S.products.filter(p=>!q || p.name.toLowerCase().includes(q)).slice(0,5).map(p=>({g:'Produits', l:p.name, s:`${stockOf(p)} en stock`, go:()=>{ location.hash='produits'; setTimeout(()=>productDrawer(p.id),50); }}));
    const custs = q ? S.customers.filter(c=>(c.first+' '+c.last+' '+c.email).toLowerCase().includes(q)).slice(0,5).map(c=>({g:'Clients', l:`${c.first} ${c.last}`, s:c.city, go:()=>customerDrawer(c.id)})) : [];
    const ords = q ? S.orders.filter(o=>o.id.toLowerCase().includes(q)).slice(-5).reverse().map(o=>({g:'Commandes', l:o.id, s:eur(o.total,2), go:()=>orderDrawer(o.id)})) : [];
    items = [...pages.filter(p=>!q || p.l.toLowerCase().includes(q)), ...ords, ...prods, ...custs];
    sel = Math.min(sel, Math.max(0, items.length-1));
    let g = '';
    $('#palL').innerHTML = items.length ? items.map((it,i)=>{ const h = it.g!==g ? `<li class="grp">${it.g}</li>` : ''; g = it.g; return `${h}<li><button type="button" class="${i===sel?'sel':''}" data-i="${i}" role="option" aria-selected="${i===sel}">${esc(it.l)}<small>${esc(it.s)}</small></button></li>`; }).join('') : '<li class="grp" style="padding:1rem .8rem">Aucun résultat. Essayez « SV-1 », un prénom ou « sweat ».</li>';
  };
  const run = i => { const it = items[i]; if (!it) return; closeModal(); it.go(); };
  $('#palQ').addEventListener('input', () => { sel = 0; draw(); });
  $('#palQ').addEventListener('keydown', e => {
    if (e.key==='ArrowDown'){ e.preventDefault(); sel = (sel+1)%Math.max(1,items.length); draw(); }
    else if (e.key==='ArrowUp'){ e.preventDefault(); sel = (sel-1+items.length)%Math.max(1,items.length); draw(); }
    else if (e.key==='Enter'){ e.preventDefault(); run(sel); }
  });
  $('#palL').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) run(+b.dataset.i); });
  draw(); setTimeout(()=>$('#palQ').focus(), 60);
}

  const sub = cart.reduce((a,l)=>{ const p = P(l.pid); return a + (p ? p.price*l.qty : 0); }, 0);

function productStamp(p){

  if (Date.now() - (p.created||0) < 14*DAY) return {k:'new', l:'Nouveau'};

  if (total <= 6) return {k:'low', l:'Derniers'};
  return {k:'ok', l:'Dispo'};
}
function shopList(){
  const sales = salesByVariant(30), sold = {};

  let list = S.products.filter(p => shopUi.cat==='all' || p.cat===shopUi.cat);

  else if (shopUi.sort==='desc') list.sort((a,b)=>b.price-a.price);
  else list.sort((a,b)=>(b.created||0)-(a.created||0));
  return {list, sold};
}

        <span class="pnum" aria-hidden="true">N° ${String(i+1).padStart(2,'0')}</span><span class="pstamp ${st.k}">${st.l}</span>
        <span class="art" style="--tint:${tintOf(p)}">${bigGarment(p)}</span>
        <span class="pbody"><span class="who">${esc(p.cat)}</span><h3>${esc(p.name)}</h3>
          <span class="pfoot"><span class="dots">${p.colors.map(c=>`<i style="background:${COLORS[c]||'#ccc'}" title="${esc(c)}"></i>`).join('')}</span><span class="price">${eur(p.price)}</span></span></span>
      </button>`; }).join('')}</div>
  </div></section>
  <footer class="s-foot"><div class="s-wrap"><div><b>Sève</b><p>Boutique fictive. Les commandes passées ici arrivent dans le back-office.</p></div><a class="btn" href="#dashboard">Passer côté vendeur</a></div></footer>`;
  document.title = 'Sève — Boutique (démo)';
}

function productModal(id, color, size){
  const p = P(id); if (!p) return;
  color = color || (p.colors.find(c => p.variants.some(v=>v.color===c && v.stock>0)) || p.colors[0]);
  const sizes = [...new Set(p.variants.map(v=>v.size))];
  const left = s => { const v = variantOf(p, color, s); return v ? v.stock - inCart(v.sku) : 0; };
  if (size && left(size) <= 0) size = null;
  if (!size && sizes.length === 1 && left(sizes[0]) > 0) size = sizes[0];
  const qmax = size ? left(size) : 1;
  const q = Math.min(+($('#modalBox [data-q]')?.dataset.q || 1), Math.max(1, qmax));
  const open = $('#modal').classList.contains('on') && $('#modalBox .dlg');
  const html = `<div class="dlg">
    <button class="close" type="button" data-act="closeModal" aria-label="Fermer">${ic('x')}</button>
    <div class="art" style="--tint:color-mix(in oklab, ${COLORS[color]||'#ccc'} 40%, #efeee9)">${bigGarment(p, color)}</div>
    <div class="dlg-info">
      <span class="kicker"><i>${esc(p.cat)}</i>Réf. ${esc(p.id.toUpperCase())}</span>
      <h2>${esc(p.name)}</h2>
      <span class="price">${eur(p.price)}</span>
      <p>${DESC[p.cat]}</p>
      <div><div class="opt-l"><span>Couleur</span><span style="text-transform:none;letter-spacing:0">${esc(color)}</span></div>
        <div class="sw-row">${p.colors.map(c=>`<button type="button" class="sw" style="background:${COLORS[c]||'#ccc'}" data-pcolor="${esc(c)}" aria-pressed="${c===color}" aria-label="${esc(c)}"></button>`).join('')}</div></div>
      <div><div class="opt-l"><span>Taille</span>${sizes.length>1?'':'<span style="text-transform:none;letter-spacing:0">Taille unique</span>'}</div>
        <div class="sz-row">${sizes.map(s=>{ const l = left(s); return `<button type="button" class="sz" data-psize="${s}" aria-pressed="${s===size}" ${l<=0?'disabled':''} aria-label="Taille ${s}${l<=0?', épuisée':l<=3?`, plus que ${l}`:''}">${s}${l>0&&l<=3?`<small>plus que ${l}</small>`:''}</button>`; }).join('')}</div></div>
      ${sizes.length>1?`<details class="guide"><summary>Guide des tailles</summary><table><thead><tr><th>Taille</th><th>Tour de poitrine</th><th>Tour de taille</th></tr></thead><tbody>${[['XS','82–86','66–70'],['S','86–92','70–76'],['M','92–98','76–82'],['L','98–104','82–88'],['XL','104–112','88–96']].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]} cm</td><td>${r[2]} cm</td></tr>`).join('')}</tbody></table></details>`:''}
      <div style="display:flex;gap:.8rem;align-items:center;flex-wrap:wrap">
        <span class="stepper"><button type="button" data-pq="-1" aria-label="Retirer un">−</button><span data-q="${q}">${q}</span><button type="button" data-pq="1" aria-label="Ajouter un">+</button></span>
        <button class="btn primary" type="button" data-addcart ${size?'':'disabled style="opacity:.5;cursor:not-allowed"'}>${size ? 'Ajouter au panier' : 'Choisissez une taille'}</button>
      </div>
      <p class="notice">Stock en direct : ${stockOf(p)} pièce${stockOf(p)>1?'s':''} au total. Expédition sous 24 à 48 h, retours gratuits pendant 30 jours.</p>
    </div></div>`;
  if (open) $('#modalBox').innerHTML = html; else openModal(html, 'wide');
  const box = $('#modalBox'); box.dataset.pid = id; box.dataset.color = color; box.dataset.size = size || '';
}

function cartDrawer(){
  const T = cartTotals();
  if (shopUi.step === 'done' && shopUi.lastOrder){
    const o = S.orders.find(x=>x.id===shopUi.lastOrder);
    openDrawer(`${head('Merci !', 'Commande confirmée')}
      <div class="drawer-body"><div class="thanks"><span class="sfx2" aria-hidden="true">やった!</span><h3>C'est dans la boîte.</h3><p>Commande n°</p><span class="ordno">${o.id}</span>
        <p style="color:var(--soft);max-width:34ch">${o.lines.reduce((a,l)=>a+l.qty,0)} article(s) pour ${eur(o.total,2)}. Un e-mail de confirmation serait envoyé à ${esc(C(o.cid).email)}.</p>
        <p style="font-weight:700;max-width:36ch">Côté vendeur, la commande est déjà dans « À préparer » et le stock a baissé.</p></div></div>
      <div class="drawer-foot"><button class="btn" type="button" data-shop-act="continue">Continuer mes achats</button><button class="btn primary" type="button" data-shop-act="seeorder">Voir dans le back-office</button></div>`);
    return;
  }
  if (!cart.length){
    openDrawer(`${head('Ton panier', 'Vide pour l\'instant')}<div class="drawer-body"><div class="empty">Ton panier est vide. Fais un tour dans la collection.</div></div><div class="drawer-foot"><button class="btn primary" type="button" data-shop-act="continue">Voir la collection</button></div>`);
    return;
  }
  const lines = cart.map((l,i)=>{ const p = P(l.pid); const v = p && p.variants.find(x=>x.sku===l.sku); if (!p || !v) return ''; return `<div class="cline">${garment(p, l.color)}<div class="info"><b>${esc(p.name)}</b><small>${esc(l.color)} · ${l.size} · ${eur(p.price)}</small><button type="button" class="rm" data-crm="${i}">Retirer</button></div><span class="stepper"><button type="button" data-cqty="${i}" data-d="-1" aria-label="Retirer un">−</button><span>${l.qty}</span><button type="button" data-cqty="${i}" data-d="1" aria-label="Ajouter un" ${l.qty >= v.stock ? 'disabled style="opacity:.35"' : ''}>+</button></span></div>`; }).join('');
  const missing = Math.max(0, FREE - T.after);
  if (shopUi.step === 'cart'){
    openDrawer(`${head('Ton panier', `${cartCount()} article${cartCount()>1?'s':''}`)}
      <div class="drawer-body">
        <div>${lines}</div>
        <div><div class="opt-l"><span>${missing ? `Plus que ${eur(missing,2)} pour la livraison offerte` : 'Livraison offerte !'}</span></div><div class="freebar"><i style="width:${Math.min(100, T.after/FREE*100)}%"></i></div></div>
        <div><div class="opt-l"><span>Code promo</span></div><form class="promo" id="promoForm"><input class="input" name="code" placeholder="BIENVENUE10" value="${shopUi.promo?esc(shopUi.promo.code):''}" aria-label="Code promo"><button class="btn sm" type="submit">Appliquer</button></form><p class="err" id="promoErr">${shopUi.promo ? '' : ''}</p></div>
        <div class="totals"><div><span>Sous-total</span><span>${eur(T.sub,2)}</span></div>${T.disc?`<div style="color:var(--hot)"><span>Code ${esc(shopUi.promo.code)}</span><span>−${eur(T.disc,2)}</span></div>`:''}<div class="big"><span>Total</span><span>${eur(T.after,2)}</span></div><small style="color:var(--soft);font-weight:500">Livraison calculée à l'étape suivante.</small></div>
      </div>
      <div class="drawer-foot"><button class="btn primary" type="button" data-shop-act="checkout">Commander</button></div>`);
    $('#promoForm').addEventListener('submit', e => { e.preventDefault(); applyPromo(new FormData(e.target).get('code')); });
    return;
  }
  // étape coordonnées
  const c = shopUi.form || {};
  openDrawer(`${head('Livraison et paiement', `Total ${eur(T.total,2)}`)}
    <form class="drawer-body form" id="coForm" novalidate style="padding:1.2rem 1.4rem">
      <div class="row"><label>Prénom<input class="input" name="first" autocomplete="given-name" value="${esc(c.first||'')}"></label><label>Nom<input class="input" name="last" autocomplete="family-name" value="${esc(c.last||'')}"></label></div>
      <label>E-mail<input class="input" name="email" type="email" autocomplete="email" value="${esc(c.email||'')}"><span class="hint">Déjà cliente ? Tes commandes seront regroupées dans ta fiche.</span></label>
      <label>Ville<input class="input" name="city" autocomplete="address-level2" value="${esc(c.city||'')}"></label>
      <div><div class="opt-l"><span>Livraison</span></div><div class="ship-opt">${Object.entries(SHIP).map(([k,s])=>`<label><input type="radio" name="ship" value="${k}" ${shopUi.ship===k?'checked':''}>${s.l}<span>${s.p===0 || T.after>=FREE ? 'Offerte' : eur(s.p,2)}</span></label>`).join('')}</div></div>
      <div class="totals"><div><span>Articles</span><span>${eur(T.after,2)}</span></div><div><span>Livraison</span><span>${T.ship?eur(T.ship,2):'Offerte'}</span></div><div class="big"><span>À payer</span><span>${eur(T.total,2)}</span></div></div>
      <p class="err" id="coErr"></p>
    </form>
    <div class="drawer-foot"><button class="btn" type="button" data-shop-act="backcart">Retour au panier</button><button class="btn primary" type="button" data-shop-act="pay">Payer ${eur(T.total,2)} (simulé)</button></div>`);
  $('#coForm').addEventListener('change', e => { if (e.target.name==='ship'){ keepForm(); shopUi.ship = e.target.value; cartDrawer(); } });
}
function keepForm(){ const f = $('#coForm'); if (!f) return; const d = new FormData(f); shopUi.form = {first:d.get('first')||'', last:d.get('last')||'', email:d.get('email')||'', city:d.get('city')||''}; }
function applyPromo(raw){
  const code = String(raw||'').trim().toUpperCase();
  if (!code){ shopUi.promo = null; cartDrawer(); return; }
  if (code === 'BIENVENUE10') shopUi.promo = {code, rate:.10};
  else if (S.promos.some(p=>p.code===code)) shopUi.promo = {code, rate:.15};
  else { $('#promoErr').textContent = 'Ce code n\'existe pas. Essaie BIENVENUE10, ou crée un code depuis une fiche client du back-office.'; return; }
  cartDrawer(); toast(`Code ${code} appliqué : −${Math.round(shopUi.promo.rate*100)} %`);
}
function placeShopOrder(){
  keepForm();
  const f = shopUi.form;
  const err = !f.first.trim() || !f.last.trim() ? 'Indique ton prénom et ton nom.' : !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim()) ? 'Indique une adresse e-mail valide, par exemple prenom@exemple.fr.' : !f.city.trim() ? 'Indique ta ville de livraison.' : '';
  if (err){ $('#coErr').textContent = err; return; }
  // revérifie le stock au moment de payer
  for (const l of cart){ const v = P(l.pid)?.variants.find(x=>x.sku===l.sku); if (!v || v.stock < l.qty){ $('#coErr').textContent = `${P(l.pid)?.name || 'Un article'} (${l.size}) n'est plus disponible en quantité suffisante. Modifie ton panier.`; return; } }
  const email = f.email.trim().toLowerCase();
  let cust = S.customers.find(c => c.email.toLowerCase() === email);
  if (!cust){ cust = {id:'c'+(S.customers.length+1)+'-'+Date.now().toString(36), first:f.first.trim(), last:f.last.trim(), email, city:f.city.trim(), loyalty:1, since:Date.now()}; S.customers.push(cust); }
  const T = cartTotals();
  const rate = shopUi.promo ? shopUi.promo.rate : 0;
  const lines = cart.map(l => ({pid:l.pid, color:l.color, size:l.size, qty:l.qty, price: Math.round(P(l.pid).price*(1-rate)*100)/100}));
  cart.forEach(l => { const v = P(l.pid).variants.find(x=>x.sku===l.sku); v.stock -= l.qty; });
  const last = S.orders.reduce((m,o)=>Math.max(m, +o.id.split('-')[1]||0), 0);
  const o = {id:'SV-' + (last+1), time:Date.now(), cid:cust.id, lines, sub:T.after, ship:T.ship, total:T.total, channel:'Site', status:'prep', hist:[{s:'created', t:Date.now()}], reason:null, promo: shopUi.promo ? shopUi.promo.code : null, fresh:true};
  S.orders.push(o); save();
  cart = []; saveCart(); shopUi.promo = null; shopUi.lastOrder = o.id; shopUi.step = 'done';
  renderShop(); cartDrawer();
}
function bumpCart(){ const b = $('.cartbtn'); if (b){ b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); } }

document.addEventListener('click', e => {
  if (route !== 'boutique') return;
  const t = e.target;
  const sp = t.closest('[data-sp]'); if (sp){ productModal(sp.dataset.sp); return; }
  const sc = t.closest('[data-scat]'); if (sc){ shopUi.cat = sc.dataset.scat; renderShop(); $('#collection').scrollIntoView({block:'start'}); return; }
  const box = $('#modalBox');
  const pc = t.closest('[data-pcolor]'); if (pc){ productModal(box.dataset.pid, pc.dataset.pcolor, box.dataset.size); return; }
  const ps = t.closest('[data-psize]'); if (ps && !ps.disabled){ productModal(box.dataset.pid, box.dataset.color, ps.dataset.psize); return; }
  const pq = t.closest('[data-pq]'); if (pq){ const span = $('[data-q]', box); const p = P(box.dataset.pid); const v = box.dataset.size && variantOf(p, box.dataset.color, box.dataset.size); const max = v ? Math.max(1, v.stock - inCart(v.sku)) : 9; const q = Math.max(1, Math.min(max, +span.dataset.q + +pq.dataset.pq)); span.dataset.q = q; span.textContent = q; return; }
  if (t.closest('[data-addcart]') && box.dataset.size){
    const p = P(box.dataset.pid), v = variantOf(p, box.dataset.color, box.dataset.size), q = +$('[data-q]', box).dataset.q;
    const ex = cart.find(l=>l.sku===v.sku); if (ex) ex.qty += q; else cart.push({sku:v.sku, pid:p.id, color:v.color, size:v.size, qty:q});
    saveCart(); closeModal(); shopUi.step = 'cart'; renderShop(); bumpCart(); toast(`${q} × ${p.name} (${v.size}) ajouté au panier`); return;
  }
  const cq = t.closest('[data-cqty]'); if (cq){ const l = cart[+cq.dataset.cqty]; l.qty += +cq.dataset.d; if (l.qty <= 0) cart.splice(+cq.dataset.cqty, 1); saveCart(); renderShop(); cartDrawer(); return; }
  const cr = t.closest('[data-crm]'); if (cr){ cart.splice(+cr.dataset.crm, 1); saveCart(); renderShop(); cartDrawer(); return; }
  const a = t.closest('[data-shop-act]'); if (!a) return;
  const act = a.dataset.shopAct;
  if (act==='cart'){ if (shopUi.step==='done') shopUi.step = 'cart'; cartDrawer(); }
  else if (act==='collection'){ $('#collection').scrollIntoView({behavior:'smooth', block:'start'}); }
  else if (act==='checkout'){ shopUi.step = 'form'; cartDrawer(); }
  else if (act==='backcart'){ keepForm(); shopUi.step = 'cart'; cartDrawer(); }
  else if (act==='pay'){ placeShopOrder(); }
  else if (act==='continue'){ shopUi.step = 'cart'; closeDrawer(); setTimeout(()=>$('#collection')?.scrollIntoView({behavior:'smooth', block:'start'}), 200); }
  else if (act==='seeorder'){ const id = shopUi.lastOrder; shopUi.step = 'cart'; closeDrawer(); ui.orderTab = 'prep'; location.hash = 'commandes'; setTimeout(()=>orderDrawer(id), 350); }
});
document.addEventListener('change', e => { if (route==='boutique' && e.target.matches('[data-shop-sort]')){ shopUi.sort = e.target.value; renderShop(); $('#collection').scrollIntoView({block:'start'}); } });

/* =========================================================
   Rendu + événements
   ========================================================= */
let toastT;
function toast(msg){ const t = $('#toast'); $('span', t).textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), 2800); }
async function copy(text, msg){ try { await navigator.clipboard.writeText(text); toast(msg); } catch(e) { toast('Copie impossible dans ce navigateur'); } }

function render(){
  document.body.classList.toggle('in-shop', route==='boutique');
  $('#modeShop').classList.toggle('on', route==='boutique'); $('#modeBack').classList.toggle('on', route!=='boutique');
  if (route==='boutique'){ renderShop(); return; }
  renderNav();
  const main = $('#main');
  main.innerHTML = route==='commandes' ? viewOrders() : route==='produits' ? viewProducts() : route==='clients' ? viewCustomers() : route==='stats' ? viewStats() : viewDashboard();
  $$('[data-line]', main).forEach(el => bindLine(el, dailySeries(period, revOf)));
  document.title = `${VIEWS[route].t} — Sève (démo)`;
}
function go(){ const h = location.hash.slice(1); route = h==='boutique' ? 'boutique' : VIEWS[h] ? h : 'dashboard'; closeModal(); if ($('#drawer').classList.contains('on')) closeDrawer(); render(); window.scrollTo(0,0); }
addEventListener('hashchange', go);
let rzT; let lastW = innerWidth; addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (Math.abs(innerWidth - lastW) > 60) { lastW = innerWidth; render(); } }, 200); });

document.addEventListener('click', e => {
  const t = e.target;
  const per = t.closest('[data-period]'); if (per){ period = +per.dataset.period; render(); return; }
  const tab = t.closest('[data-otab]'); if (tab){ ui.orderTab = tab.dataset.otab; render(); return; }
  const pc = t.closest('[data-pcat]'); if (pc){ ui.prodCat = pc.dataset.pcat; render(); return; }
  const cs = t.closest('[data-cseg]'); if (cs){ ui.custSeg = cs.dataset.cseg; render(); return; }
  const todo = t.closest('.todo a'); if (todo){ if (todo.dataset.tab) ui.orderTab = todo.dataset.tab; if (todo.dataset.state) { ui.prodState = 'low'; ui.prodCat='all'; } }
  const st = t.closest('[data-stock]'); if (st){
    const pid = $('#drawer').dataset.product, p = P(pid), v = p.variants.find(x=>x.sku===st.dataset.stock);
    v.stock = Math.max(0, v.stock + (+st.dataset.d) * (e.shiftKey ? 10 : 1)); save(); render(); productDrawer(pid);
    const again = $(`[data-stock="${CSS.escape(v.sku)}"][data-d="${st.dataset.d}"]`); again && again.focus(); return; }
  const oa = t.closest('[data-oact]'); if (oa){ setOrderStatus($('#drawer').dataset.order, oa.dataset.oact); return; }
  const or = t.closest('[data-order]'); if (or){ orderDrawer(or.dataset.order); return; }
  const pr = t.closest('[data-product]'); if (pr && !t.closest('.drawer')){ productDrawer(pr.dataset.product); return; }
  const cu = t.closest('[data-customer]'); if (cu){ customerDrawer(cu.dataset.customer); return; }
  const cp = t.closest('[data-copy]'); if (cp){ copy(cp.dataset.copy, 'Adresse e-mail copiée'); return; }
  const pm = t.closest('[data-promo]'); if (pm){ const c = C(pm.dataset.promo); const code = 'SEVE-' + c.first.toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').slice(0,6) + '15'; S.promos.push({code, cid:c.id, t:Date.now()}); save(); copy(code, `Code ${code} créé (−15 %) et copié`); return; }
  const a = t.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act==='close') closeDrawer();
  else if (act==='closeModal') closeModal();
  else if (act==='palette') palette();
  else if (act==='newProduct') newProductModal();
  else if (act==='threshold') thresholdModal();
  else if (act==='csv'){
    const rows = [['commande','date','client','ville','canal','articles','total','statut']].concat(S.orders.filter(o=>ui.orderTab==='all'||o.status===ui.orderTab).map(o=>{ const c = C(o.cid); return [o.id, new Date(o.time).toISOString().slice(0,10), `${c.first} ${c.last}`, c.city, o.channel, o.lines.reduce((a,l)=>a+l.qty,0), o.total.toFixed(2), STATUS[o.status].l]; }));
    copy(rows.map(r=>r.map(x=>/[;"\n]/.test(String(x)) ? `"${String(x).replace(/"/g,'""')}"` : x).join(';')).join('\n'), `${rows.length-1} commandes copiées au format CSV`);
  }
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); palette(); return; }
  if (e.key==='Escape'){ if ($('#modal').classList.contains('on')) closeModal(); else if ($('#drawer').classList.contains('on')) closeDrawer(); }
  if (e.key==='Enter' && e.target.matches('tr[tabindex]')) e.target.click();
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.in; if (!k) return;
  ui[k] = e.target.value; const pos = e.target.selectionStart; render();
  const el = $(`[data-in="${k}"]`); if (el){ el.focus(); try { el.setSelectionRange(pos,pos); } catch(_){} }
});
$('#scrim').addEventListener('click', closeDrawer);
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
$('#hoodBtn').addEventListener('click', hoodDrawer);
$('#hoodBtn2').addEventListener('click', hoodDrawer);
$('#resetBtn').addEventListener('click', () => { S = generate(); save(); render(); toast('Démo réinitialisée'); });
const themeLabel = () => { $('#themeBtn span').textContent = document.documentElement.dataset.theme==='dark' ? 'Mode clair' : 'Mode sombre'; };
$('#themeBtn').addEventListener('click', () => { const n = document.documentElement.dataset.theme==='dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = n; try{ localStorage.setItem('seve-manga-theme', n); }catch(_){} themeLabel(); });
themeLabel();
const st = document.createElement('style'); st.textContent = '@keyframes draw{to{stroke-dashoffset:0}}@keyframes growY{from{transform:scaleY(0)}}'; document.head.appendChild(st);
go();
})();
</script>
